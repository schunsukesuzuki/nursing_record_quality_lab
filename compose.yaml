name: nursing-record-quality-lab
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [internal]

  model-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-ec"]
    command: 'ollama show "$$MODEL_NAME" >/dev/null 2>&1 || ollama pull "$$MODEL_NAME"'
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL_NAME: ${MODEL_NAME:-qwen3:0.6b}
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  inference:
    build: ./inference
    environment:
      OLLAMA_URL: http://ollama:11434
      MODEL_NAME: ${MODEL_NAME:-qwen3:0.6b}
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/live', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [internal]

  backend:
    build: ./backend
    environment:
      INFERENCE_URL: http://inference:8100
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-120}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      INFERENCE_AUTH_MODE: none
    depends_on:
      inference:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    restart: unless-stopped
    networks: [internal]

networks:
  internal: {}
volumes:
  ollama_models: {}
